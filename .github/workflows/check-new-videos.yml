name: Check tracked YouTube channels for new videos

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check channels for new videos
        id: check
        run: python3 check_new_videos.py

      - name: Commit updated watch state
        if: steps.check.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .automation/
          git commit -m "Record newly seen videos on tracked channels"
          git push

      - name: Open issue with the new videos
        if: steps.check.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "New videos on tracked channels ($(date +%Y-%m-%d))" \
            --body-file /tmp/new_videos_issue_body.md
