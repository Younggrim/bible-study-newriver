        .mem-card-body { padding: 4px 22px 20px; font-family: 'Merriweather', serif; font-size: 1.08rem; line-height: 2.2rem; color: var(--ink-deep); min-height: calc(2.2rem * 4 + 24px);
            background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.2rem - 1px), var(--rule-soft) calc(2.2rem - 1px), var(--rule-soft) 2.2rem);
            background-origin: content-box; background-clip: content-box; }
        .mem-card-body.prompt { display: grid; place-items: center; text-align: center; color: var(--text-faint); font-style: italic; font-size: 0.98rem; }
        .mem-w { white-space: nowrap; }
        .mem-blank { display: inline-block; height: 1.2em; vertical-align: -0.2em; border: 0; border-bottom: 2px solid var(--accent-link); border-radius: 1px; background: transparent; padding: 0; margin: 0 1px; cursor: pointer; }

        .mem-modes button { font-family: 'Inter', sans-serif; border: 0; border-right: 1px solid var(--border-medium); background: transparent; padding: 9px 6px; font-size: 0.84rem; font-weight: 600; color: var(--ink-deep); cursor: pointer; }

        .mem-modes button[aria-pressed="true"] { background: var(--ink-deep); color: #fff; }
        .mem-modes button:focus-visible, .mem-chip:focus-visible { outline: 2px solid var(--accent-link); outline-offset: -2px; }
        .mem-card-body.mem-built { min-height: calc(2.2rem * 2 + 24px); }
        .mem-built .mem-slot { display: inline-block; width: 2.4em; height: 1.2em; vertical-align: -0.2em; border: 0; border-bottom: 2px solid var(--accent-link); border-radius: 0; background: none; }
        .mem-pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 22px 20px; }
        .mem-chip { font-family: 'Merriweather', serif; font-size: 1rem; border: 1px solid var(--border-medium); background: #fff; color: var(--ink-deep); border-radius: 8px; padding: 8px 12px; cursor: pointer; min-height: 44px; }
        .mem-chip.wrong { border-color: #b5473f; background: #f6e3e1; color: #b5473f; animation: mem-shake 0.3s; }

        .mem-type { width: 100%; box-sizing: border-box; font-family: 'Merriweather', serif; font-size: 1rem; line-height: 1.7; color: var(--ink-deep); background: #fff; border: 1px solid var(--border-medium); border-radius: 8px; padding: 12px 14px; min-height: 150px; resize: vertical; }
        .mem-type:focus { outline: 2px solid var(--accent-link); outline-offset: 1px; }

        .mem-typo { text-decoration: underline dotted #8a5e0e; text-underline-offset: 4px; }
        .mem-miss { background: #f6e3e1; color: #b5473f; border-radius: 3px; padding: 0 2px; }
        .mem-extra { color: var(--text-faint); text-decoration: line-through; }
        .mem-score { font-family: 'Inter', sans-serif; font-weight: 700; color: var(--ink-deep); }
        .mem-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-faint); }
        .mem-tab { padding-left: 6px; padding-right: 6px; }

        .mem-col { display: flex; flex-direction: column; gap: 6px; text-align: left; background: #fff; border: 1px solid var(--border-light); border-radius: 12px; padding: 16px 18px; cursor: pointer; font-family: 'Inter', sans-serif; color: var(--ink-deep); }

                return { text: out.join(' ').replace(/[\s ]+/g, ' ').trim() };
            });
        }
        function loadPassage() {
            clearTimeout(lookupTimer);
            if (!picked()) return;
            $id('memLookupNote').textContent = 'Loading…';
            lookupTimer = setTimeout(loadNow, 700);
        }
        function loadNow() {
            clearTimeout(lookupTimer);
            var sel = picked(), txt = $id('memAddText'), note = $id('memLookupNote');
            if (!sel || !txt) return;
            var tr = $id('memAddTr').value, label = refLabel(sel.b, sel.c, sel.v1, sel.v2), seq = ++lookupSeq;
            addRef = label; txt.value = ''; note.textContent = 'Loading ' + label + '…';
            (tr === 'ESV' ? fetchEsv(sel) : fetchSite(sel, tr)).then(function(r) {
                if (seq !== lookupSeq || !txt.isConnected) return;
                if (!r.text) { note.textContent = label + ' is not in the ' + tr + ' text here. Pick another verse or translation, or paste the text.'; return; }
                txt.value = r.text; if (r.ref) addRef = r.ref;
                note.textContent = addRef + ' (' + tr + '). Check it, then add it.';
            }).catch(function() {
                if (seq !== lookupSeq || !note.isConnected) return;
                note.textContent = navigator.onLine === false ? 'You are offline. Paste the text, or try again when you are back online.' : 'The text could not be loaded just now. Try again in a moment, or paste it.';
            });
        }
        function showTopic() {
            var box = $id('memTopicList'), t = TOPICS[$id('memTopic').value];
            if (!t) { box.innerHTML = ''; return; }
            var have = {};
            all().forEach(function(v) { have[v.ref.replace(/[–-]/g, '-').toLowerCase()] = true; });
            box.innerHTML = '<div class="mem-list" style="margin-top:14px">' + t.refs.map(function(r, i) {
                var label = refLabel(r[0], r[1], r[2], r[3]), got = have[label.replace(/–/g, '-').toLowerCase()];
                return '<div class="mem-item"><span class="mem-ref">' + esc(label) + '</span>' + (got ? '<span class="mem-chip later">In your list</span>'
                    : '<button type="button" class="mem-btn" data-a="suggest" data-i="' + i + '" style="padding:6px 14px">Use</button>') + '</div>';
            }).join('') + '</div>' + (t.page ? '<p class="mem-note" style="margin-top:12px">From the study <a href="' + t.page + '">' + esc(t.name) + '</a>.</p>' : '');
        }
        function useSuggestion(i) {
            var t = TOPICS[$id('memTopic').value], r = t && t.refs[i]; if (!r) return;
            $id('memBook').value = r[0]; setChapters();
            $id('memChapter').value = r[1]; setVerses();
            $id('memVerse').value = r[2]; setThrough();
            $id('memVerseTo').value = r[3] || '';
            loadNow();
            try { main.querySelector('form[data-f="add"]').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
        }

        /* ---------- backup ---------- */
        function backup() {
            var blob = new Blob([JSON.stringify({ app: 'bible-study-memory', version: 1, exportedAt: new Date().toISOString(), verses: all() }, null, 2)], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'memory-verses-' + today() + '.json';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function() { URL.revokeObjectURL(a.href); }, 4000);
        }
        function restoreFrom(file) {
            var reader = new FileReader();
            reader.onload = function() {
                var added = 0, skipped = 0;
                try {
                    var data = JSON.parse(reader.result);
                    var list = Array.isArray(data) ? data : Array.isArray(data.verses) ? data.verses : Object.keys(data.verses || {}).map(function(k) { return data.verses[k]; });
                    var have = {};
                    all().forEach(function(v) { have[(v.ref + '|' + (v.translation || 'ESV')).toLowerCase()] = true; });
                    list.forEach(function(o) {
                        var v = cleanVerse(o); if (!v) return;
                        var key = (v.ref + '|' + v.translation).toLowerCase();
                        if (have[key]) { skipped++; return; }
                        have[key] = true; touch(v); S.verses[v.id] = v; added++;
                    });
                    save(); scheduleSync();
                    S.notice = added ? 'Restored ' + added + (added === 1 ? ' verse.' : ' verses.') + (skipped ? ' Skipped ' + skipped + ' already in your list.' : '') : skipped ? 'Nothing new to restore. All ' + skipped + ' were already in your list.' : 'That file has no verses in it.';
                } catch (e) { S.notice = 'That file could not be read. Choose a backup file made by this page.'; }
                render();
            };
            reader.readAsText(file);
        }

        /* ---------- actions ---------- */
        function top() { try { window.scrollTo(0, 0); } catch (e) {} }
        function startSession(ids) { S.session = { queue: ids, i: 0, revealed: false, hint: false, done: 0, missed: 0, requeued: {}, mode: reviewMode(), order: newOrder(), typed: '', result: null }; S.practice = null; S.view = 'today'; render(); top(); }
        function openPractice(id, from) { var v = S.verses[id]; if (!v) return; if (from === 'collections') S.view = 'collections'; S.practice = { id: id, from: from || S.view, step: v.stage === 'learning' ? (v.fadeStep || 0) : 0, seed: 1, peeked: {}, mode: 'say', order: newOrder(), typed: '', result: null }; render(); top(); }
        function setStep(n) {
            var P = S.practice, v = S.verses[P.id];
            P.step = Math.max(0, Math.min(STEPS.length - 1, n)); P.peeked = {};
            if (v.stage === 'learning' && P.step > (v.fadeStep || 0)) patch(v.id, { fadeStep: P.step }); else render();
        }
        function focusType() { var t = document.getElementById('memType'); if (t) t.focus(); }
        function testPick(i) {
            var X = S.practice || S.session, v = S.verses[S.practice ? S.practice.id : S.session.queue[S.session.i]];
            if (!v) return;
            if (i === null) orderHelp(v, X.order); else orderPick(v, X.order, i);
            // Finishing the order in a review shows the verse and the grades.
            if (!S.practice && X.order.pos >= verseWords(v).length) X.revealed = true;
            render();
        }
        function typeCheck() {
            var X = S.practice || S.session, v = S.verses[S.practice ? S.practice.id : S.session.queue[S.session.i]], t = document.getElementById('memType');
            if (!v) return;
            X.typed = t ? t.value : X.typed;
            if (!X.typed.trim()) { focusType(); return; }
            X.result = checkTyped(v, X.typed);
            if (!S.practice) X.revealed = true;
            render(); top();
        }
        function grade(g) {
            var Q = S.session, id = Q.queue[Q.i], v = S.verses[id];
            if (!Q.requeued[id]) Q.done++;
            if (g === 0 && !Q.requeued[id]) { Q.queue.push(id); Q.requeued[id] = true; Q.missed++; }
            Q.i++; Q.revealed = false; Q.hint = false; Q.order = newOrder(); Q.typed = ''; Q.result = null;
            patch(id, nextFor(v, g));
        }
        document.querySelector('.page-content').addEventListener('click', function(e) {
            var b = e.target.closest('[data-a]'); if (!b) return;
            var a = b.dataset.a, id = b.dataset.id;
            switch (a) {
                case 'nav': S.session = null; S.practice = null; S.detail = null; S.editing = false; S.confirmDel = false; S.confirmOut = false; S.collection = null; S.view = b.dataset.v; main.innerHTML = ''; render(); break;
                case 'dismiss': S.notice = ''; render(); break;
                case 'suggest': useSuggestion(+b.dataset.i); break;
                case 'open-col': S.collection = +b.dataset.i; try { localStorage.setItem('memory-collection', b.dataset.i); } catch (e) {} render(); top(); break;
                case 'col-back': S.collection = null; render(); top(); break;
                case 'col-next': addFromCollection(+b.dataset.i, null); break;
                case 'col-add': addFromCollection(+b.dataset.i, b.dataset.k); break;
                case 'start': startSession(dueList().map(function(v) { return v.id; })); break;
                case 'review-one': startSession([id]); break;
                case 'practice': openPractice(id, b.dataset.from); break;
                case 'exit-practice': S.practice = null; render(); break;
                case 'step': setStep(+b.dataset.s); break;
                case 'next': setStep(S.practice.step + 1); break;
                case 'prev': setStep(S.practice.step - 1); break;
                case 'shuffle': S.practice.seed++; S.practice.peeked = {}; render(); break;
                case 'peek': S.practice.peeked[+b.dataset.i] = true; render(); break;
                case 'graduate': var pid = S.practice.id; S.practice = null; patch(pid, { stage: 'review', fadeStep: STEPS.length - 1, interval: 1, reps: 0, ease: 2.5, due: addDays(today(), 1) }); break;
                case 'hint': S.session.hint = true; render(); break;
                case 'pmode': S.practice.mode = b.dataset.m; S.practice.order = newOrder(); S.practice.result = null; render(); if (b.dataset.m === 'type') focusType(); break;
                case 'qmode': S.session.mode = b.dataset.m; S.session.order = newOrder(); try { localStorage.setItem('memory-review-mode', b.dataset.m); } catch (e) {} render(); if (b.dataset.m === 'type') focusType(); break;
                case 'ord-pick': testPick(+b.dataset.i); break;
                case 'ord-help': testPick(null); break;
                case 'ord-again': S.practice.order = newOrder(); S.practice.order.seed = Date.now() % 997 + 2; render(); break;
                case 'type-check': typeCheck(); break;
                case 'type-again': S.practice.result = null; S.practice.typed = ''; render(); focusType(); break;
                case 'reveal': S.session.revealed = true; render(); break;
                case 'grade': grade(+b.dataset.g); break;
                case 'end': S.session = null; render(); break;
                case 'detail': S.detail = S.detail === id ? null : id; S.confirmDel = false; S.editing = false; render(); break;
                case 'edit': S.editing = true; main.innerHTML = ''; render(); break;
                case 'cancel-edit': S.editing = false; main.innerHTML = ''; render(); break;
                case 'relearn': patch(id, { stage: 'learning', fadeStep: 0, interval: 0, reps: 0, ease: 2.5, due: null }); break;
                case 'ask-delete': S.confirmDel = true; render(); break;
                case 'keep': S.confirmDel = false; render(); break;
                case 'delete': S.confirmDel = false; S.detail = null; remove(id); break;
                case 'backup': backup(); break;
                case 'signin': account.openSignIn({ reason: 'Your memory verses and review schedule are saved to your account, so they follow you to any device.' }); break;
                case 'ask-signout': S.confirmOut = true; render(); break;
                case 'keep-in': S.confirmOut = false; render(); break;
                case 'signout': S.confirmOut = false; b.disabled = true; sync().then(function() { return account.signOut(); }); break;
                case 'sync': sync(); break;
                case 'restore': fileInput.value = ''; fileInput.click(); break;
            }
        });
        document.querySelector('.page-content').addEventListener('input', function(e) {
            if (e.target.id !== 'memType') return;
            var X = S.practice || S.session; if (X) X.typed = e.target.value;
        });
        fileInput.addEventListener('change', function() { if (fileInput.files && fileInput.files[0]) restoreFrom(fileInput.files[0]); });
        document.querySelector('.page-content').addEventListener('submit', function(e) {
            e.preventDefault();
            var f = e.target;
            if (f.dataset.f === 'add') {
                var sel = picked(), text = document.getElementById('memAddText').value.trim().replace(/\s+/g, ' ');
                if (!sel) { document.getElementById('memLookupNote').textContent = 'Choose a book, chapter and verse first.'; return; }
                if (!text) { document.getElementById('memLookupNote').textContent = 'Add the verse text first.'; return; }
                var ref = addRef || refLabel(sel.b, sel.c, sel.v1, sel.v2);
                var id = newId(), tr = document.getElementById('memAddTr').value;
                try { localStorage.setItem('memory-translation', tr); } catch (e) {}
                main.innerHTML = ''; S.view = 'today';
                create({ id: id, ref: ref, text: text, translation: tr, stage: 'learning', fadeStep: 0, interval: 0, ease: 2.5, reps: 0, lapses: 0, due: null, lastReviewed: null, addedAt: new Date().toISOString() });
                openPractice(id, 'today');
            } else if (f.dataset.f === 'edit') {
                var eid = f.dataset.id, nref = document.getElementById('memEditRef').value.trim(), ntext = document.getElementById('memEditText').value.trim().replace(/\s+/g, ' ');
                if (!nref || !ntext) return;
                S.editing = false; main.innerHTML = '';
                patch(eid, { ref: nref, translation: document.getElementById('memEditTr').value.trim() || 'ESV', text: ntext });
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.target.id === 'memType' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); typeCheck(); return; }
            if (e.target.matches('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
            if (S.practice) {
                if (S.practice.mode !== 'say') return;
                if (e.key === 'ArrowRight') setStep(S.practice.step + 1);
                else if (e.key === 'ArrowLeft') setStep(S.practice.step - 1);
            } else if (S.session && S.session.i < S.session.queue.length) {
                if (!S.session.revealed && S.session.mode !== 'say') return;
                if (!S.session.revealed) {
                    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); S.session.revealed = true; render(); }
                    else if (e.key.toLowerCase() === 'h') { S.session.hint = true; render(); }
                } else if (/^[1-4]$/.test(e.key)) grade(+e.key - 1);
            }
        });
        // Pick up changes made in another tab of the same site.
        window.addEventListener('storage', function(e) { if (e.key === STORE_KEY && !S.session && !S.practice) { load(); render(); } });

        load();
        render();
        if (account) {
            account.onChange(onAccount);
            // Catch up when the app comes back to the front or the connection returns.
            document.addEventListener('visibilitychange', function() { if (!document.hidden && S.user && !S.session && !S.practice) sync(); });
            window.addEventListener('online', function() { if (S.user) sync(); else if (account.hasSession()) account.ready().catch(function() {}); });
        }
    })();
    </script>
</body>
</html>
