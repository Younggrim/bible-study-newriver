<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3d2b1f">
    <title>Daily Devotional — Bible Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="site/style.css">
    <style>
        body { background: #faf5ed; }
        .page-content { margin: 0 auto; max-width: 720px; padding: 24px 20px 100px; }
        .devo-date { font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; color: #8a7e74; text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-bottom: 8px; }
        .devo-hero { background: linear-gradient(135deg, #3d2b1f 0%, #5c3d6e 50%, #2c6b4f 100%); border-radius: 16px; padding: 40px 28px; text-align: center; margin-bottom: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .devo-hero h1 { font-family: 'Cinzel', serif; font-size: 1.6rem; color: #fff; margin: 0 0 6px; text-shadow: 1px 1px 4px rgba(0,0,0,0.4); }
        .devo-hero .devo-ref { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; color: #f0c865; letter-spacing: 0.5px; }
        .devo-card { background: #fff; border: 1px solid #e8e0d6; border-radius: 14px; padding: 28px 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .devo-card h2 { font-family: 'Cinzel', serif; font-size: 1rem; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
        .devo-card h2 i { font-size: 0.9rem; }
        .devo-card p { font-size: 0.92rem; color: #3d342e; line-height: 1.85; margin: 0; }
        .devo-verse-text { font-family: 'Merriweather', serif; font-style: italic; font-size: 1.05rem; color: #3d2b1f; line-height: 2; border-left: 3px solid #8b3a2a; padding-left: 18px; margin: 0; }
        .devo-section-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #fff; }
        .icon-scripture { background: #8b3a2a; }
        .icon-reflect { background: #4a5a8a; }
        .icon-prayer { background: #2c6b4f; }
        .icon-apply { background: #5c3d6e; }
        .devo-reminder-banner { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e8e0d6; border-left: 4px solid #f0c865; border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .devo-reminder-icon { width: 38px; height: 38px; border-radius: 10px; background: #3d2b1f; color: #f0c865; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .devo-reminder-text { flex: 1; min-width: 0; }
        .devo-reminder-title { font-weight: 700; font-size: 0.92rem; color: #3d2b1f; margin-bottom: 2px; }
        .devo-reminder-sub { font-size: 0.8rem; color: #8a7e74; line-height: 1.4; }
        .devo-reminder-btn { background: #8b3a2a; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
        .devo-reminder-dismiss { background: none; border: none; color: #aaa; font-size: 1.3rem; cursor: pointer; padding: 2px 4px; line-height: 1; }
        .devo-reminder-status { text-align: center; font-size: 0.82rem; color: #8a7e74; padding: 10px; cursor: pointer; }
        .devo-reminder-status i { color: #f0c865; }
        .devo-reminder-time-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .devo-reminder-time-row label { font-size: 0.78rem; color: #5c5248; font-weight: 600; }
        .devo-reminder-time-row select { font-family: 'Inter', sans-serif; font-size: 0.82rem; color: #3d2b1f; background: #faf5ed; border: 1px solid #e8e0d6; border-radius: 6px; padding: 5px 8px; }
        .devo-reminder-turnoff { background: none; border: none; color: #8b3a2a; font-size: 0.78rem; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; margin-left: 4px; }
        @media (max-width: 768px) { .devo-hero { padding: 28px 18px; } .devo-hero h1 { font-size: 1.3rem; } .devo-card { padding: 22px 18px; } .devo-reminder-banner { flex-wrap: wrap; } }
    </style>
</head>
<body>
    <main class="page-content" style="margin-top:20px;">
        <p class="devo-date" id="devoDate"></p>
        <div class="devo-hero">
            <h1>Daily Devotional</h1>
            <p class="devo-ref" id="devoRef"></p>
        </div>

        <div class="devo-card">
            <h2><span class="devo-section-icon icon-scripture"><i class="fas fa-book-open"></i></span> Today's Scripture</h2>
            <p class="devo-verse-text" id="devoText"></p>
        </div>

        <div class="devo-card">
            <h2><span class="devo-section-icon icon-reflect"><i class="fas fa-lightbulb"></i></span> Reflection</h2>
            <p id="devoReflection"></p>
        </div>

        <div class="devo-card">
            <h2><span class="devo-section-icon icon-prayer"><i class="fas fa-hands-praying"></i></span> Prayer Prompt</h2>
            <p id="devoPrayer"></p>
        </div>

        <div class="devo-card">
            <h2><span class="devo-section-icon icon-apply"><i class="fas fa-bullseye"></i></span> Apply It</h2>
            <p id="devoApplication"></p>
        </div>

        <div class="devo-nav">
            <div class="devo-reminder-banner" id="devoReminderBanner" style="display:none;">
                <div class="devo-reminder-icon"><i class="fas fa-bell"></i></div>
                <div class="devo-reminder-text">
                    <div class="devo-reminder-title" id="devoReminderTitle">Enable Daily Reminders</div>
                    <div class="devo-reminder-sub">Choose a time and get a nudge each day when today's devotional is ready.</div>
                    <div class="devo-reminder-time-row">
                        <label for="devoReminderTime">Remind me at</label>
                        <select id="devoReminderTime"></select>
                        <button class="devo-reminder-turnoff" id="devoReminderTurnoff" type="button" style="display:none;">Turn off reminders</button>
                    </div>
                </div>
                <button class="devo-reminder-btn" id="devoReminderEnable">Enable</button>
                <button class="devo-reminder-dismiss" id="devoReminderDismiss" aria-label="Dismiss">&times;</button>
            </div>
            <div class="devo-reminder-status" id="devoReminderStatus" style="display:none;">
                <i class="fas fa-bell"></i> <span id="devoReminderStatusText">Reminders on</span>
            </div>
        </div>
    </main>
    <script src="site/script.js"></script>
    <script>
    (function() {
        var devotionals = [];
        var currentIndex = 0;
        var ESV_PROXY = 'https://esv-proxy.cloudflare-dust598.workers.dev';

        function getDayIndex() {
            // Start date: Jul 22, 2026 = index 0
            var start = new Date(2026, 6, 22); // month is 0-indexed
            var now = new Date();
            now.setHours(0,0,0,0);
            start.setHours(0,0,0,0);
            var diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            if (diff < 0) diff = 0;
            return diff;
        }

        function formatDate() {
            var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('en-US', options);
        }

        function render(index) {
            var d = devotionals[index];
            if (!d) return;
            document.getElementById('devoDate').textContent = formatDate();
            document.getElementById('devoRef').textContent = d.verse;
            document.getElementById('devoReflection').textContent = d.reflection;
            document.getElementById('devoPrayer').textContent = d.prayer;
            document.getElementById('devoApplication').textContent = d.application;
            currentIndex = index;

            // Fetch actual ESV text for the verse
            var textEl = document.getElementById('devoText');
            textEl.innerHTML = '<em style="color:#8a7e74;font-size:0.88rem;">Loading scripture...</em>';
            fetch(ESV_PROXY + '/?q=' + encodeURIComponent(d.verse))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.passages && data.passages[0]) {
                        textEl.innerHTML = data.passages[0];
                    } else {
                        textEl.textContent = d.text;
                    }
                })
                .catch(function() {
                    textEl.textContent = d.text;
                });
        }

        fetch('devotionals.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                devotionals = data;
                var todayIndex = getDayIndex();
                if (todayIndex >= devotionals.length) todayIndex = devotionals.length - 1;
                render(todayIndex);
            })
            .catch(function() {
                document.getElementById('devoText').textContent = 'Unable to load devotional. Please try again.';
            });
    })();
    </script>
    <script>
    // Daily reminder opt-in — Web Push subscription for this devotional.
    (function() {
        var VAPID_PUBLIC_KEY = 'BBXso6T-C1Ft59FLWrdRfANGYtKm21CHUktfb0rsmfDZOEJSFyn5Y62f2ZaFMr0PxiPCIyN9Wm6_8MxXMQ6AGuY';
        var PUSH_WORKER = 'https://devotional-push.cloudflare-dust598.workers.dev';

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
        }

        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
            return; // not supported here (e.g. non-installed iOS Safari) — nothing to show
        }

        var banner = document.getElementById('devoReminderBanner');
        var status = document.getElementById('devoReminderStatus');
        var statusText = document.getElementById('devoReminderStatusText');
        var titleEl = document.getElementById('devoReminderTitle');
        var enableBtn = document.getElementById('devoReminderEnable');
        var dismissBtn = document.getElementById('devoReminderDismiss');
        var turnoffBtn = document.getElementById('devoReminderTurnoff');
        var timeSelect = document.getElementById('devoReminderTime');

        function urlBase64ToUint8Array(base64String) {
            var base64 = base64String.replace(/-/g, '+').replace(/_/g, '/');
            var padded = base64 + new Array((4 - base64.length % 4) % 4 + 1).join('=');
            var raw = atob(padded);
            var arr = new Uint8Array(raw.length);
            for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
            return arr;
        }

        function postSubscription(path, payload) {
            return fetch(PUSH_WORKER + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // Selecting an hour in the visitor's own local time, then reading
        // it back via getUTCHours(), lets the browser's own DST-aware
        // Date math do the local-to-UTC conversion instead of hand-rolled
        // offset arithmetic. (The stored hourUTC is an absolute value —
        // it isn't re-derived daily, so a subscriber's delivery time can
        // drift by an hour across a DST transition, same known tradeoff
        // as the rest of this feature.)
        function localHourToUTCHour(localHour) {
            var d = new Date();
            d.setHours(localHour, 0, 0, 0);
            return d.getUTCHours();
        }

        function formatHourLabel(localHour) {
            var d = new Date();
            d.setHours(localHour, 0, 0, 0);
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }

        function getSavedHour() {
            var h = parseInt(localStorage.getItem('devo-push-hour'), 10);
            return isNaN(h) ? 8 : h;
        }

        function populateTimeOptions(selectedHour) {
            timeSelect.innerHTML = '';
            for (var h = 5; h <= 22; h++) {
                var opt = document.createElement('option');
                opt.value = String(h);
                opt.textContent = formatHourLabel(h);
                if (h === selectedHour) opt.selected = true;
                timeSelect.appendChild(opt);
            }
        }

        function refreshUI() {
            if (Notification.permission === 'denied') {
                banner.style.display = 'none';
                status.style.display = 'none';
                return;
            }
            navigator.serviceWorker.ready.then(function(reg) {
                reg.pushManager.getSubscription().then(function(sub) {
                    var savedHour = getSavedHour();
                    var subscribed = !!sub && Notification.permission === 'granted';
                    populateTimeOptions(savedHour);
                    turnoffBtn.style.display = subscribed ? 'inline' : 'none';
                    titleEl.textContent = subscribed ? 'Change Reminder Time' : 'Enable Daily Reminders';
                    enableBtn.textContent = subscribed ? 'Save' : 'Enable';
                    if (subscribed) {
                        statusText.textContent = 'Reminders on at ' + formatHourLabel(savedHour) + ' — tap to change';
                        status.style.display = 'block';
                        banner.style.display = 'none';
                    } else {
                        status.style.display = 'none';
                        banner.style.display = localStorage.getItem('devo-push-dismissed') ? 'none' : 'flex';
                    }
                });
            }).catch(function() {});
        }

        enableBtn.addEventListener('click', function() {
            var chosenHour = parseInt(timeSelect.value, 10);
            Notification.requestPermission().then(function(permission) {
                if (permission !== 'granted') { refreshUI(); return; }
                navigator.serviceWorker.ready.then(function(reg) {
                    reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                    }).then(function(subscription) {
                        var payload = subscription.toJSON();
                        payload.hourUTC = localHourToUTCHour(chosenHour);
                        localStorage.setItem('devo-push-hour', String(chosenHour));
                        return postSubscription('/subscribe', payload);
                    }).then(function() {
                        localStorage.removeItem('devo-push-dismissed');
                        refreshUI();
                    }).catch(function() { refreshUI(); });
                });
            });
        });

        dismissBtn.addEventListener('click', function() {
            banner.style.display = 'none';
            navigator.serviceWorker.ready.then(function(reg) {
                reg.pushManager.getSubscription().then(function(sub) {
                    if (!sub) localStorage.setItem('devo-push-dismissed', '1');
                });
            });
        });

        turnoffBtn.addEventListener('click', function() {
            navigator.serviceWorker.ready.then(function(reg) {
                reg.pushManager.getSubscription().then(function(sub) {
                    if (!sub) { refreshUI(); return; }
                    var endpoint = sub.endpoint;
                    sub.unsubscribe().then(function() {
                        postSubscription('/unsubscribe', { endpoint: endpoint }).catch(function() {});
                        localStorage.removeItem('devo-push-dismissed');
                        refreshUI();
                    });
                });
            });
        });

        // Tapping the "reminders on" status line re-opens the banner
        // (pre-filled with the current time) so it can be reused both
        // to change the time and, via Turn off, to unsubscribe — one
        // UI surface instead of scattering controls around the page.
        status.addEventListener('click', function() {
            status.style.display = 'none';
            banner.style.display = 'flex';
        });

        refreshUI();
    })();
    </script>
</body>
</html>
